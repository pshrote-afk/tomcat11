<script>
function populateEvents(month,year)
{
$.ajax({
url:"getEvents",
type:"GET",
dataType:"json",
data:{"month":month,"year":year},
success:function(results){
let data = results;

let accordionDiv; 
let titleHeader;
let dayOfMonth;
let td;

for(let k=0;k<data.length;k++)
{
dayOfMonth = data[k].dayOfMonth;
td = $("#day-"+dayOfMonth).parent();
if($(td).find("div[name='accordionDiv']").length==0)
{
accordionDiv = $("<div>");
accordionDiv.attr("name","accordionDiv");
accordionDiv.css("scale","0.75");
td.append(accordionDiv);
}
else
{
accordionDiv = $(td).find("div[name='accordionDiv']");
}
titleHeader = $("<h6>").text(data[k].details.title);

let detailsDiv = $("#eventDetailsTooltip").clone().removeAttr("id");
let innerDivs = detailsDiv.find("> div");
innerDivs[0]; 					//do nothing, "Event Details" text is hardcoded into original div with id=eventDetailsTooltip
innerDivs[1].append(" " + data[k].details.date);
innerDivs[2].append(" " + data[k].details.startTime);
innerDivs[3].append(" " + data[k].details.endTime);
innerDivs[4].append(" " + data[k].details.venue);
innerDivs[5].append(" " + data[k].details.description);
innerDivs[6].append(" " + data[k].details.outsiders);
innerDivs[7].append(" " + data[k].details.committeeName);

titleHeader.attr("title","");	//element on which tooltip is to be show must have "title" attribute

titleHeader.tooltip({
track:true,
content:function(){
return detailsDiv.html();
}
});

accordionDiv.append(titleHeader);
accordionDiv.append(document.createElement("div")); //append dummy div so that accordion() functionality works because it requires header tag followed by div tag

if(!accordionDiv.data("ui-accordion"))
{
	accordionDiv.accordion({
	collapsible:true,
	active:false
	});
}
else
{
accordionDiv.accordion("refresh");
}

}
},
error:function(error){
alert("error occurred while populating events");
}
});
}

function createMonthGrid(days)
{
let td;
let tr;
let table = document.getElementById("monthGrid");
let tableBody = table.querySelector("tbody");
tableBody.innerHTML="";
for(let r=0;r<days.length;r++)
{
tr = document.createElement("tr");
for(let c=0;c<days[r].length;c++)
{
td = document.createElement("td");
var dateDiv = document.createElement("div");
if(days[r][c]==0) dateDiv.textContent = "";
else dateDiv.textContent = days[r][c];

dateDiv.id = "day-" + days[r][c];
dateDiv.style.textAlign = "left";
td.appendChild(dateDiv);
tr.appendChild(td);
}
//append
tableBody.appendChild(tr);
}
}

function reloadMonthGrid(month,year)
{
if(!month) month = $('#monthSelector').val();
if(!year) year = $('#yearSelector').val();

$.ajax({
url:"getMonthGrid",
type:"GET",
dataType:"json",
data:{"month":month,"year":year},
success:function(results){
let days = results;
createMonthGrid(days);
populateEvents(month,year);
},
error:function(error){
alert("error occurred while creating month grid");
}
});
}

window.addEventListener('load',reloadMonthGrid());
</script>



<table id='monthGrid' border="1" cellspacing="0" cellpadding="5" class='ui-state-highlight monthGrid'>
  <thead>
    <tr>
      <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
    </tr>
  </thead>
<tbody>
</tbody>
</table>

<!--sample tooltip div, which will be cloned-->
<div id="eventDetailsTooltip" style="display:none; font-family:Segoe UI, sans-serif; font-size:13px; color:#222;" 
class="ui-widget ui-front ui-widget-content ui-corner-all ui-widget-shadow">
  <div style="font-weight:600; font-size:14px; margin-bottom:6px;">Event Details</div>
  <div style="margin-bottom:4px;"><strong>Date:</strong></div>
  <div style="margin-bottom:4px;"><strong>Start time:</strong></div>
  <div style="margin-bottom:4px;"><strong>End time:</strong></div>
  <div style="margin-bottom:4px;"><strong>Venue:</strong></div>
  <div style="margin-bottom:6px; line-height:1.4;"><strong>Description:</strong><br></div>
  <div style="margin-bottom:4px;"><strong>Open for outsiders:</strong></div>
  <div><strong>Organising committee:</strong></div>
</div>
